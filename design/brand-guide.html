<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emerg Music — Brand guide</title><link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--bg);color:var(--text);font:var(--text-base)/1.6 var(--font-body)}
main{max-width:960px;margin:0 auto;padding:48px 24px}h1,h2{font-family:var(--font-heading)}h2{margin-top:56px;font-size:var(--text-xl)}
.row{display:flex;flex-wrap:wrap;gap:16px}.sw{width:150px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.sw i{display:block;height:72px}.sw p{margin:8px 12px;font-size:var(--text-sm)}.tile{padding:24px;border-radius:12px;border:1px solid var(--border)}
.light{background:#fff}img{max-width:100%}</style></head><body><main>
<img src="../public/brand/logo-horizontal.svg" alt="Emerg Music" height="64"><p style="color:var(--text-muted)">Discover. Stream. Share.</p>
<h2>Logo set</h2><div class="row">
<div class="tile"><img src="../public/brand/logo-primary.svg" alt="Primary" width="220"></div>
<div class="tile"><img src="../public/brand/symbol.svg" alt="Symbol" width="90"></div>
<div class="tile"><img src="../public/brand/app-icon.svg" alt="App icon" width="90"> <img src="../public/brand/favicon.svg" alt="Favicon" width="32"></div>
<div class="tile light"><img src="../public/brand/logo-horizontal-on-light.svg" alt="On light" width="240"></div>
<div class="tile"><img src="../public/brand/logo-horizontal-mono-ivory.svg" alt="Mono ivory" width="240"></div>
<div class="tile light"><img src="../public/brand/logo-horizontal-mono-night.svg" alt="Mono night" width="240"></div></div>
<h2>Plum Velvet</h2><div class="row">
<div class="sw"><i style="background:#130f18"></i><p>Night #130F18</p></div><div class="sw"><i style="background:#38213f"></i><p>Plum #38213F</p></div>
<div class="sw"><i style="background:#8f50b5"></i><p>Violet #8F50B5</p></div><div class="sw"><i style="background:#d6a6f5"></i><p>Lilac #D6A6F5</p></div>
<div class="sw"><i style="background:#f8f2ff"></i><p style="color:#130f18;background:#f8f2ff;margin:0;padding:8px 12px">Ivory #F8F2FF</p></div></div>
<h2>Type</h2><p style="font:700 var(--text-3xl) var(--font-heading);margin:0">Space Grotesk — headings</p><p>Inter — body and interface text.</p>
<h2>Components</h2><div class="row"><button class="btn btn-primary">Play</button><button class="btn btn-secondary">Save</button><input class="input" placeholder="Search"></div>
<div class="alert alert-success" style="margin-top:16px">Release submitted for review.</div>
</main></body></html>
